[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "karstlab"
dynamic = ["version"]
description = "Cross-platform terrain analysis for karst regions."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
authors = [
  { name = "KarstLab" }
]
keywords = ["gis", "karst", "dem", "lidar", "terrain-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "branca>=0.7",
  "contextily>=1.6",
  "folium>=0.17",
  "geopandas>=1.0",
  "gpxpy>=1.6",
  "jinja2>=3.1",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pydantic>=2.8",
  "pyproj>=3.6",
  "pyside6>=6.7",
  "rasterio>=1.3",
  "scikit-image>=0.24",
  "scipy>=1.14",
  "shapely>=2.0",
  "simplekml>=1.3",
  "whitebox>=2.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
package = [
  "pyinstaller>=6.9",
]

[project.scripts]
karstlab = "karstlab.cli.main:main"

[project.gui-scripts]
karstlab-gui = "karstlab.presentation.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/karstlab"]

[tool.hatch.version]
path = "src/karstlab/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "network: tests that require external network access",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/karstlab", "tests"]
explicit_package_bases = true
mypy_path = ["src", "."]

[[tool.mypy.overrides]]
module = ["affine", "rasterio", "rasterio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["geopandas", "gpxpy", "gpxpy.*", "shapely", "shapely.*", "simplekml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["whitebox", "whitebox.*"]
ignore_missing_imports = true
